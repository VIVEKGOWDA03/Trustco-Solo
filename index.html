<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Landing Page Title</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <!-- Placeholder: Navigation and Logo -->
        <section id="hero">
            <div class="hero-container">
                <div class="NavBar">
                    <img class="company logo" src="/Assets/logo.svg" alt="company logo">
                    <nav class="hero-nav">
                        <ul class="">
                            <li><a href="#">Features</a></li>
                            <li><a href="#">Solutions</a></li>
                            <li><a href="#">Company</a></li>
                            <li><a href="#">Resources</a></li>
                            <li><a href="#">Contact</a></li>

                        </ul>
                    </nav>
                    <div class="login-signin-btn">
                        <button class="login-btn">login</button>
                        <button class="signin-btn">signin</button>
                        <button class="menu-btn"> <img src="/Assets/menu.svg"></button>
                    </div>
                </div>

                <div class="Banner">
                    <div class="Banner-item">
                        <div class="banner-one">
                            <img src="/Assets/bannerone.svg " alt="one">
                        </div>
                        <div class="banner-two">
                            <p class="Hero_Tag">
                                Find a High-Potential
                                Customers with
                                <span class="span">
                                    Trustco.
                                </span>
                            </p>
                            <p class="hero-subtag">
                                We provide sales teams and professionals with the knowledge, skill and discipline they
                                need to be 10x more successful.
                            </p>
                            <div class="CTA">
                                <button class="cta-one">Get Started</button>
                                <button class="cta-two"><img src="/Assets/Play.svg"> Check Our Video</button>

                            </div>
                        </div>
                        <div class="banner-three">
                            <img src="/Assets/bannertwo.svg " alt="two">

                        </div>
                        <div class="banner-four">
                            <img class="one" src="/Assets/bannerone.svg " alt="two">
                            <img class="two" src="/Assets/bannertwo.svg " alt="two">
                        </div>
                    </div>
                </div>
                <!-- Trusted companies -->
                <div class="ClientBrandsSection">
                    <div class="grp">
                        <p class="">
                            Trusted by the best in the world
                        </p>
                        <div class="compnay-grp">
                            <img class="" src="/Assets/google.svg" alt="company-grp">
                            <img class="" src="/Assets/alt.svg" alt="company-grp">
                            <img class="" src="/Assets/canon.svg" alt="company-grp">
                            <img class="" src="/Assets/walmart.svg" alt="company-grp">
                            <img class="" src="/Assets/amazon.svg" alt="company-grp">
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </header>

    <!-- Main Content Section -->
    <main>

    </main>

    <!-- Footer Section -->
    <footer>

    </footer>
