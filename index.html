<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

</head>

<body>
    <!-- Header Section -->
    <header>
        <!-- Placeholder: Navigation and Logo -->
        <section id="hero">
            <div class="hero-container">
                <!-- Navigation Bar -->

        
                <!-- hero-Section -->
                <div class="hero-banner">
                    <div class="banner-content">
                        <div class="banner-image-left">
                            <img src="/Assets/bannerone.svg" alt="banner image 1">
                        </div>
                        <div class="banner-text">
                            <p class="hero-tagline">
                                Find High-Potential Customers with <span class="highlight-text">Trustco</span>
                            </p>
                            <p class="hero-subtagline">
                                We provide sales teams and professionals with the knowledge, skill, and discipline they need to be 10x more successful.
                            </p>
                            <div class="cta-buttons">
                                <button class="cta-start-btn">Get Started</button>
                                <button class="cta-video-btn"><img src="/Assets/Play.svg" alt="play icon"> Check Our Video</button>
                            </div>
                        </div>
                        <div class="banner-image-right">
                            <img src="/Assets/bannertwo.svg" alt="banner image 2">
                        </div>
                        <div class="banner-image-group">
                            <img class="image-one" src="/Assets/bannerone.svg" alt="banner image 1">
                            <img class="image-two" src="/Assets/bannertwo.svg" alt="banner image 2">
                        </div>
                    </div>
                </div>

        
            </div>
        </section>
        
    </header>

    <!-- Main Content Section -->
    <main>

    </main>

    <!-- Footer Section -->
    <footer>

    </footer>
</body>

</html>
